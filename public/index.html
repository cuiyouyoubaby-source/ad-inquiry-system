<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>广告库存询量系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f5f7fa;
            color: #333;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }
        
        .header-nav {
            display: flex;
            gap: 30px;
        }
        
        .header-nav a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.9;
            transition: opacity 0.3s;
        }
        
        .header-nav a:hover {
            opacity: 1;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .page-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }
        
        /* 搜索筛选区域 */
        .search-filter {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        
        .filter-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .filter-item label {
            font-size: 12px;
            color: #666;
            font-weight: 500;
        }
        
        .filter-item input,
        .filter-item select {
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
            min-width: 200px;
        }
        
        .filter-item input:focus,
        .filter-item select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5a6fd6;
        }
        
        .btn-success {
            background: #52c41a;
            color: white;
        }
        
        .btn-success:hover {
            background: #49ad18;
        }
        
        /* 表格样式 */
        .data-table {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        
        .data-table table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .data-table th,
        .data-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .data-table th {
            background: #fafafa;
            font-weight: 600;
            font-size: 13px;
            color: #666;
        }
        
        .data-table tr:hover {
            background: #f5f7fa;
        }
        
        .data-table td {
            font-size: 14px;
        }
        
        /* 分页 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 20px;
        }
        
        .pagination button {
            padding: 6px 12px;
            border: 1px solid #d9d9d9;
            background: white;
            cursor: pointer;
            border-radius: 4px;
        }
        
        .pagination button:hover {
            border-color: #667eea;
            color: #667eea;
        }
        
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* 询量页面 */
        .inquiry-form {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .form-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .form-item label {
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }
        
        .form-item label .required {
            color: #ff4d4f;
            margin-left: 4px;
        }
        
        .form-item input,
        .form-item select,
        .form-item textarea {
            padding: 10px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .form-item input:focus,
        .form-item select:focus,
        .form-item textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-item textarea {
            min-height: 80px;
            resize: vertical;
        }
        
        /* 城市选择 */
        .city-selector {
            display: flex;
            gap: 20px;
        }
        
        .city-column {
            flex: 1;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            padding: 10px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .city-column h4 {
            font-size: 14px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .city-item {
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 4px;
            margin-bottom: 4px;
        }
        
        .city-item:hover {
            background: #f5f7fa;
        }
        
        .city-item.selected {
            background: #667eea;
            color: white;
        }
        
        /* 结果展示 */
        .result-panel {
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .result-panel h3 {
            color: #52c41a;
            margin-bottom: 15px;
        }
        
        .result-value {
            font-size: 32px;
            font-weight: 600;
            color: #52c41a;
        }
        
        /* 标签页 */
        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid #d9d9d9;
            margin-bottom: 20px;
        }
        
        .tab {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }
        
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        
        .tab:hover {
            color: #667eea;
        }
        
        /* 隐藏 */
        .hidden {
            display: none;
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 15px;
            }
            
            .filter-row {
                flex-direction: column;
            }
            
            .form-row {
                flex-direction: column;
            }
            
            .city-selector {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>📊 广告库存询量系统</h1>
            <nav class="header-nav">
                <a href="#list" onclick="showPage('list')">询量记录</a>
                <a href="#inquiry" onclick="showPage('inquiry')">新建询量</a>
                <a href="#config" onclick="showPage('config')">参数配置</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <!-- 询量记录列表页 -->
        <div id="page-list" class="page">
            <h2 class="page-title">询量记录列表</h2>
            
            <div class="search-filter">
                <div class="filter-row">
                    <div class="filter-item">
                        <label>询量名称</label>
                        <input type="text" id="searchName" placeholder="模糊搜索">
                    </div>
                    <div class="filter-item">
                        <label>广告主</label>
                        <input type="text" id="searchAdvertiser" placeholder="精准匹配">
                    </div>
                    <div class="filter-item">
                        <label>资源位</label>
                        <select id="searchSlot">
                            <option value="">全部</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <label>&nbsp;</label>
                        <button class="btn btn-primary" onclick="searchInquiry()">搜索</button>
                    </div>
                </div>
            </div>
            
            <div class="data-table">
                <table>
                    <thead>
                        <tr>
                            <th>询量ID</th>
                            <th>询量名称</th>
                            <th>媒体</th>
                            <th>广告主</th>
                            <th>资源位</th>
                            <th>有效天数</th>
                            <th>理论可售卖量</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="inquiryList">
                        <!-- 动态加载 -->
                    </tbody>
                </table>
            </div>
            
            <div class="pagination">
                <button onclick="prevPage()" id="prevBtn">上一页</button>
                <span id="pageInfo">第 1 页</span>
                <button onclick="nextPage()" id="nextBtn">下一页</button>
            </div>
        </div>

        <!-- 新建询量页 -->
        <div id="page-inquiry" class="page hidden">
            <h2 class="page-title">新建询量</h2>
            
            <div class="inquiry-form">
                <div class="form-row">
                    <div class="form-item">
                        <label>询量名称 <span class="required">*</span></label>
                        <input type="text" id="inquiryName" maxlength="120" placeholder="请输入询量名称">
                    </div>
                    <div class="form-item">
                        <label>广告主</label>
                        <input type="text" id="advertiser" maxlength="120" placeholder="请输入广告主">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-item">
                        <label>品牌</label>
                        <input type="text" id="brand" maxlength="120" placeholder="请输入品牌">
                    </div>
                    <div class="form-item">
                        <label>媒体 <span class="required">*</span></label>
                        <select id="media">
                            <option value="banana" selected>banana</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-item">
                        <label>资源位 <span class="required">*</span></label>
                        <select id="slotId">
                            <option value="">请选择资源位</option>
                        </select>
                    </div>
                    <div class="form-item">
                        <label>有效投放天数 <span class="required">*</span></label>
                        <input type="number" id="effectiveDays" min="1" placeholder="请输入天数">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-item">
                        <label>请求倍率</label>
                        <input type="number" id="requestMultiplier" value="1.0" step="0.1" placeholder="默认1.0">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-item">
                        <label>定向城市</label>
                        <div class="city-selector">
                            <div class="city-column">
                                <h4>省份</h4>
                                <div id="provinceList">
                                    <!-- 动态加载 -->
                                </div>
                            </div>
                            <div class="city-column">
                                <h4>城市分级</h4>
                                <div id="cityTierList">
                                    <div class="city-item" data-tier="一线">一线</div>
                                    <div class="city-item" data-tier="新一线">新一线</div>
                                    <div class="city-item" data-tier="二线">二线</div>
                                    <div class="city-item" data-tier="三线">三线</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="form-row">
                    <button class="btn btn-success" onclick="calculateInquiry()">计算询量</button>
                </div>
                
                <div id="resultPanel" class="result-panel hidden">
                    <h3>📈 询量结果</h3>
                    <div class="result-value" id="resultValue">0</div>
                    <p>理论可售卖量（曝光）</p>
                </div>
            </div>
        </div>

        <!-- 参数配置页 -->
        <div id="page-config" class="page hidden">
            <h2 class="page-title">参数配置</h2>
            
            <div class="tabs">
                <div class="tab active" onclick="showConfigTab('factors')">业务因子</div>
                <div class="tab" onclick="showConfigTab('coefficients')">系数配置</div>
                <div class="tab" onclick="showConfigTab('baseData')">基础数据</div>
            </div>
            
            <!-- 业务因子 -->
            <div id="config-factors" class="config-content">
                <div class="data-table">
                    <table>
                        <thead>
                            <tr>
                                <th>因子键</th>
                                <th>因子值</th>
                                <th>描述</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="factorsList">
                            <!-- 动态加载 -->
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!-- 系数配置 -->
            <div id="config-coefficients" class="config-content hidden">
                <div class="data-table">
                    <table>
                        <thead>
                            <tr>
                                <th>资源位</th>
                                <th>城市分级</th>
                                <th>系数值</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="coefficientsList">
                            <!-- 动态加载 -->
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!-- 基础数据 -->
            <div id="config-baseData" class="config-content hidden">
                <div class="data-table">
                    <table>
                        <thead>
                            <tr>
                                <th>资源位</th>
                                <th>城市</th>
                                <th>设备数</th>
                                <th>屏幕尺寸</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="baseDataList">
                            <!-- 动态加载 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let currentPage = 1;
        let pageSize = 10;
        let totalRecords = 0;
        
        // 页面切换
        function showPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(`page-${page}`).classList.remove('hidden');
            
            if (page === 'list') {
                loadInquiryList();
            } else if (page === 'config') {
                loadConfigData();
            }
        }
        
        // 加载询量列表
        async function loadInquiryList() {
            try {
                const response = await fetch(`/api/inquiry?page=${currentPage}&pageSize=${pageSize}`);
                const result = await response.json();
                
                if (result.success) {
                    renderInquiryList(result.data.list);
                    totalRecords = result.data.total;
                    updatePagination();
                }
            } catch (error) {
                console.error('加载询量列表失败:', error);
            }
        }
        
        // 渲染询量列表
        function renderInquiryList(list) {
            const tbody = document.getElementById('inquiryList');
            tbody.innerHTML = list.map(item => `
                <tr>
                    <td>${item.inquiry_id.substring(0, 8)}...</td>
                    <td>${item.inquiry_name}</td>
                    <td>${item.media}</td>
                    <td>${item.advertiser || '-'}</td>
                    <td>${item.slot_name || item.slot_id}</td>
                    <td>${item.effective_days}</td>
                    <td>${item.theoretical_inventory?.toLocaleString() || '-'}</td>
                    <td>${new Date(item.created_at).toLocaleString()}</td>
                    <td>
                        <button class="btn btn-primary" onclick="viewDetail('${item.inquiry_id}')">查看</button>
                    </td>
                </tr>
            `).join('');
        }
        
        // 搜索询量
        function searchInquiry() {
            currentPage = 1;
            loadInquiryList();
        }
        
        // 分页
        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                loadInquiryList();
            }
        }
        
        function nextPage() {
            if (currentPage * pageSize < totalRecords) {
                currentPage++;
                loadInquiryList();
            }
        }
        
        function updatePagination() {
            document.getElementById('pageInfo').textContent = `第 ${currentPage} 页`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage * pageSize >= totalRecords;
        }
        
        // 计算询量
        async function calculateInquiry() {
            const inquiryName = document.getElementById('inquiryName').value;
            const advertiser = document.getElementById('advertiser').value;
            const brand = document.getElementById('brand').value;
            const media = document.getElementById('media').value;
            const slotId = document.getElementById('slotId').value;
            const effectiveDays = document.getElementById('effectiveDays').value;
            const requestMultiplier = document.getElementById('requestMultiplier').value;
            
            if (!inquiryName || !slotId || !effectiveDays) {
                alert('请填写必填项');
                return;
            }
            
            const data = {
                inquiry_name: inquiryName,
                advertiser: advertiser,
                brand: brand,
                media: media,
                slot_id: slotId,
                effective_days: parseInt(effectiveDays),
                request_multiplier: parseFloat(requestMultiplier) || 1.0
            };
            
            try {
                const response = await fetch('/api/inquiry', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('resultPanel').classList.remove('hidden');
                    document.getElementById('resultValue').textContent = result.data.theoretical_inventory.toLocaleString();
                } else {
                    alert('计算失败: ' + result.message);
                }
            } catch (error) {
                console.error('计算询量失败:', error);
                alert('计算失败，请稍后重试');
            }
        }
        
        // 查看详情
        function viewDetail(inquiryId) {
            alert('查看详情功能开发中...');
        }
        
        // 加载配置数据
        async function loadConfigData() {
            // 加载资源位
            try {
                const response = await fetch('/api/ad-slots');
                const result = await response.json();
                
                if (result.success) {
                    const slotSelect = document.getElementById('slotId');
                    slotSelect.innerHTML = '<option value="">请选择资源位</option>' + 
                        result.data.map(slot => `<option value="${slot.slot_id}">${slot.slot_name}</option>`).join('');
                }
            } catch (error) {
                console.error('加载资源位失败:', error);
            }
        }
        
        // 配置标签页切换
        function showConfigTab(tab) {
            document.querySelectorAll('.config-content').forEach(c => c.classList.add('hidden'));
            document.getElementById(`config-${tab}`).classList.remove('hidden');
            
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            showPage('list');
            loadConfigData();
        });
    </script>
</body>
</html>
